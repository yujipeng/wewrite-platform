[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wewrite-platform"
version = "0.1.0"
description = "WeWrite 本地可视化工作台（loopback 单机单用户）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "wewrite==4.2.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
wewrite-platform = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
