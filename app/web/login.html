<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · WeWrite 工作台</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo">W</div>
        <div>
          <div class="name">WeWrite 工作台</div>
          <div class="sub">公众号写作流水线</div>
        </div>
      </div>
      <div class="login-body">
        <h1 class="login-title">登录</h1>
        <form id="login-form" class="login-form" method="post" action="/auth/login">
          <div class="field">
            <label for="username">账号</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div id="login-error" class="login-error" role="alert"></div>
          <button type="submit" class="btn primary login-submit">登录</button>
        </form>
      </div>
    </div>
    <div class="login-foot">WeWrite 工作台 · 本地单机</div>
  </main>
  <script type="module">
    // 登录后跳转目标清洗：与后端 app.middleware.safe_next 同一口径。
    // 只接受站内相对路径（单斜杠开头、非 //、无反斜杠/控制字符/空白），
    // 其余一律回落到 "/"，防止 javascript: / 协议相对地址等开放重定向。
    function safeNext(raw) {
      const fallback = "/";
      if (!raw) return fallback;
      if (!raw.startsWith("/") || raw.startsWith("//")) return fallback;
      if (raw.includes("\\")) return fallback;
      if (/[\s\u0000-\u001f\u007f]/.test(raw)) return fallback;
      return raw;
    }

    const form = document.getElementById("login-form");
    const err = document.getElementById("login-error");
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      err.textContent = "";
      const fd = new FormData(form);
      try {
        const res = await fetch("/auth/login", { method: "POST", body: fd });
        if (res.ok) {
          const params = new URLSearchParams(location.search);
          const next = safeNext(params.get("next"));
          location.href = next;
          return;
        }
        let msg = "登录失败";
        try { msg = (await res.json()).message || msg; } catch (_) { /* ignore */ }
        err.textContent = msg;
      } catch (_) {
        err.textContent = "网络错误，请重试";
      }
    });
  </script>
</body>
</html>
