# docker-compose v1.29 兼容语法（本机只有 docker-compose v1.29.2，无 docker compose v2 插件）
services:
  workbench:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - wewrite_home:/data/wewrite
    environment:
      - WEWRITE_HOME=/data/wewrite
      # 公网域名白名单与登录账号：从项目目录 .env 插值注入（见 README「公网域名白名单与登录鉴权」）。
      # 缺省为空 → 公网 Host 被拒、无可用账号（fail closed），回环访问不受影响。
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - WEWRITE_USERS=${WEWRITE_USERS:-}
    restart: unless-stopped

volumes:
  wewrite_home: {}
